<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打纸杯 · CupSplash（键盘演示版）</title>
    <style>
      body { margin: 0; background: #1c2733; font-family: system-ui, "Microsoft YaHei", sans-serif; overflow: hidden; }
      #app { width: 100vw; height: calc(100vh - 64px); }
      #sim-panel {
        height: 64px; display: flex; gap: 8px; align-items: center; padding: 0 16px;
        background: #101820; flex-wrap: nowrap; overflow-x: auto;
      }
      #sim-panel button {
        padding: 8px 14px; border: 0; border-radius: 8px; cursor: pointer;
        background: #2d425a; color: #eaf2f8; font-size: 14px; white-space: nowrap;
      }
      #sim-panel button:hover { background: #3a5573; }
      #sim-panel button.gift { background: #7a4dd8; }
      #sim-panel button.gift:hover { background: #8f63e8; }
      #sim-panel .label { color: #7f95a8; font-size: 12px; margin-right: 4px; white-space: nowrap; }
      #legend {
        position: fixed; left: 16px; bottom: 78px; padding: 12px 16px;
        background: rgba(8, 18, 26, 0.72); border-radius: 10px;
        color: #dbe9f5; font-size: 13px; line-height: 1.9; pointer-events: none;
      }
      #legend b { color: #ffd166; display: inline-block; min-width: 34px; }
      body.clean #sim-panel, body.clean #legend { display: none; }
      body.clean #app { height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="legend">
      <div><b>空格</b> 免费击发（可长按连发）</div>
      <div><b>J</b> 礼物 · 多发一发（可长按）</div>
      <div><b>K</b> 礼物 · 双发（可长按）</div>
      <div><b>L</b> 礼物 · 彩虹清杯（长按慢速）</div>
      <div><b>S</b> 开始/下一局 &nbsp; <b>E</b> 结束 &nbsp; <b>H</b> 隐藏界面</div>
    </div>
    <div id="sim-panel">
      <span class="label">键盘演示模式（H 隐藏此栏）</span>
      <button id="btn-start">开始一局</button>
      <button id="btn-free">弹幕 · 免费击发</button>
      <button id="btn-gift1" class="gift">礼物 · 多发一发</button>
      <button id="btn-gift2" class="gift">礼物 · 双发</button>
      <button id="btn-rainbow" class="gift">礼物 · 彩虹清杯</button>
      <button id="btn-end">结束本局</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
